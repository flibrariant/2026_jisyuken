<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <meta name="description" content="QommonsAI自主研の本の銀河。みんなのおすすめ本が浮かぶ空間。気になる本をタップして「読みたい」を押すだけ。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="本の銀河｜QommonsAI自主研" />
  <meta property="og:description" content="おすすめ本が浮かぶ空間。なでて回して、気になる本をタップ。" />
  <title>本の銀河｜QommonsAI自主研</title>
  <style>
    :root {
      --bg: #05070f;
      --ink: #eef2ff;
      --muted: #9aa6c4;
      --panel: rgba(12, 16, 32, .92);
      --line: rgba(255,255,255,.12);
      --accent: #ffd85a;
      --heart: #ff5c8a;
      --blue: #5b8cff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; line-height: 1.6; }
    button, input, textarea { font: inherit; }
    #stage { position: fixed; inset: 0; touch-action: none; }
    #stage canvas { display: block; }
    /* 周辺減光: 画面の端を暗くして中心の銀河に目が行くように */
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
      background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(2,3,10,.55) 100%); }

    .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
      padding: calc(12px + env(safe-area-inset-top)) 14px 0; pointer-events: none; z-index: 5; }
    .top > * { pointer-events: auto; }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .06em;
      background: linear-gradient(100deg, #fff6d6 0%, #ffd85a 45%, #ffb3c8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 12px rgba(255,216,90,.35)) drop-shadow(0 2px 10px rgba(0,0,0,.7)); }
    .brand small { color: var(--muted); font-size: 12px; }
    .hearts { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--panel);
      border: 1px solid var(--line); font-size: 13px; font-weight: 800; cursor: pointer; }
    .hearts .h { color: var(--heart); font-size: 15px; letter-spacing: 2px; }
    .hearts .h .off { opacity: .22; }
    .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 4;
      padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.45); color: var(--muted); font-size: 13px; pointer-events: none;
      transition: opacity .5s ease; white-space: nowrap; }
    .hint.gone { opacity: 0; }

    .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; }
    .bottom > * { pointer-events: auto; }
    .btn { padding: 11px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--panel);
      cursor: pointer; font-weight: 800; font-size: 14px; }
    .btn.primary { color: #1b1300; background: var(--accent); border-color: transparent; }
    .btn.heart { color: #fff; background: var(--heart); border-color: transparent; }
    .btn.heart.on { background: #2b1a22; color: var(--heart); border-color: var(--heart); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.small { padding: 8px 12px; font-size: 13px; }

    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 82vh; overflow: auto;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0;
      background: var(--panel); border-top: 1px solid var(--line); backdrop-filter: blur(14px);
      transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
    .sheet.open { transform: translateY(0); }
    .sheet .close { position: absolute; top: 10px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.08); color: var(--ink); cursor: pointer; font-size: 18px; }
    .grab { width: 40px; height: 4px; margin: 0 auto 10px; border-radius: 2px; background: rgba(255,255,255,.2); }
    .detail { display: grid; grid-template-columns: 112px 1fr; gap: 14px; }
    .detail img, .detail .noimg { width: 112px; aspect-ratio: 0.7; object-fit: cover; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.6); background: #1a2340; }
    .detail .noimg { display: flex; align-items: center; justify-content: center; padding: 8px; font-size: 12px; color: var(--muted); text-align: center; }
    .detail h2 { margin: 0 0 4px; font-size: 17px; line-height: 1.35; }
    .detail .meta { margin: 0; color: var(--muted); font-size: 12px; }
    .detail .price { margin: 6px 0 0; font-size: 14px; font-weight: 800; color: var(--accent); }
    .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
    .facts li { padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); font-size: 11.5px; }
    .desc { margin: 12px 0 0; }
    .desc h3 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: .04em; }
    .desc p { margin: 0; font-size: 13.5px; line-height: 1.7; white-space: pre-line; color: #dfe5f7;
      display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .desc.open p { display: block; -webkit-line-clamp: unset; }
    .desc button { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--blue); font-size: 12px; cursor: pointer; }
    .desc small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    /* AI が書いた紹介は枠と色を変えて、出版社の紹介文と見分けがつくようにする */
    .desc.ai { padding: 10px 12px; border-radius: 12px; border: 1px dashed rgba(91,140,255,.5); background: rgba(91,140,255,.07); }
    .desc.ai h3 { color: #9fb6ff; }
    .desc.ai small { color: #9fb6ff; opacity: .85; }
    .obi { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: rgba(255,216,90,.08); border-radius: 0 10px 10px 0; font-size: 14px; }
    .obi small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .voters { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
    .voters span { display: inline-block; margin: 2px 6px 0 0; padding: 1px 8px; border-radius: 999px; background: rgba(255,92,138,.15); color: #ffb3c8; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
    .actions a { color: var(--blue); font-size: 13px; }

    label { display: block; margin: 10px 0 4px; font-size: 12px; font-weight: 800; color: var(--muted); }
    input[type=text], input[type=number], textarea { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255,255,255,.06); color: var(--ink); }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .cands { display: grid; gap: 8px; margin-top: 10px; }
    .cand { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(255,255,255,.04); cursor: pointer; text-align: left; color: var(--ink); }
    .cand img, .cand .noimg { width: 44px; aspect-ratio: .7; object-fit: cover; border-radius: 3px; background: #1a2340; }
    .cand b { display: block; font-size: 13px; line-height: 1.3; }
    .cand small { color: var(--muted); font-size: 11px; }
    .picked { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; margin-top: 10px; padding: 10px; border-radius: 12px; background: rgba(255,216,90,.08); border: 1px solid rgba(255,216,90,.3); }
    .picked img, .picked .noimg { width: 64px; aspect-ratio: .7; object-fit: cover; border-radius: 4px; background: #1a2340; }
    .counter { text-align: right; font-size: 11px; color: var(--muted); }
    .counter.over { color: var(--heart); font-weight: 800; }
    .note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

    .modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.6); }
    .modal.open { display: flex; }
    .modal .box { width: min(360px, 100%); padding: 20px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
    .modal h3 { margin: 0 0 6px; font-size: 17px; }
    .modal p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }

    .toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translate(-50%, -10px); z-index: 30;
      padding: 10px 16px; border-radius: 12px; background: #fff; color: #111; font-weight: 800; font-size: 14px; opacity: 0;
      transition: opacity .2s ease, transform .2s ease; pointer-events: none; max-width: calc(100% - 32px); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--heart); color: #fff; }

    /* WebGL が使えないときの2D表示 */
    #grid { display: none; position: fixed; inset: 0; overflow: auto; padding: calc(70px + env(safe-area-inset-top)) 14px 90px; z-index: 1; }
    #grid .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
    #grid button { padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; text-align: left; }
    #grid img, #grid .noimg { width: 100%; aspect-ratio: .7; object-fit: cover; border-radius: 6px; background: #1a2340; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    #grid .noimg { display: flex; align-items: center; justify-content: center; padding: 6px; font-size: 11px; color: var(--muted); text-align: center; }
    #grid b { display: block; margin-top: 4px; font-size: 11px; line-height: 1.3; }
    .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; z-index: 2; pointer-events: none; }
    /* 分類チップ（上のバー）。横にスクロール */
    .chips { position: fixed; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top)); z-index: 5; display: flex; gap: 6px; padding: 4px 14px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; pointer-events: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { pointer-events: auto; flex: none; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(12,16,32,.75);
      color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; backdrop-filter: blur(8px); }
    .chips button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--c, #fff); box-shadow: 0 0 8px var(--c, #fff); }
    .chips button.on { color: #fff; border-color: var(--c, var(--accent)); background: rgba(255,255,255,.1); }
    .chips button small { opacity: .6; margin-left: 4px; font-weight: 400; }

    /* 詳細: ひとこと中心 */
    .head { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; }
    .head img, .head .noimg { width: 84px; aspect-ratio: 0.7; object-fit: cover; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.6); background: #1a2340; }
    .head h2 { margin: 0 0 3px; font-size: 16px; line-height: 1.35; }
    .head .meta { margin: 0; color: var(--muted); font-size: 12px; }
    .labels { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .labels .genre { padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; color: #0b0f1c; background: var(--c, #9fb6ff); }
    .labels .tag { padding: 2px 9px; border-radius: 999px; font-size: 11.5px; color: #dfe5f7; background: rgba(255,255,255,.1); }
    .labels .tag.add { background: none; border: 1px dashed var(--line); color: var(--muted); cursor: pointer; }
    .voices { margin: 14px 0 0; display: grid; gap: 8px; }
    .voice { position: relative; padding: 10px 12px 10px 14px; border-radius: 0 12px 12px 0; border-left: 3px solid var(--accent); background: rgba(255,216,90,.08); font-size: 14.5px; line-height: 1.6; }
    .voice.want { border-left-color: var(--heart); background: rgba(255,92,138,.08); font-size: 13.5px; }
    .voice small { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px; }
    .voice.empty { border-left-color: var(--line); background: rgba(255,255,255,.04); color: var(--muted); font-size: 13px; }
    .wantrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .wantrow .names { font-size: 12px; color: var(--muted); }
    .wantrow .names span { display: inline-block; margin: 2px 6px 0 0; padding: 1px 8px; border-radius: 999px; background: rgba(255,92,138,.15); color: #ffb3c8; }
    .wantbox { display: none; margin-top: 10px; padding: 10px; border-radius: 12px; background: rgba(255,92,138,.08); border: 1px solid rgba(255,92,138,.3); }
    .wantbox.open { display: block; }
    .wantbox input { margin-top: 6px; }
    .wantbox .row { margin-top: 8px; justify-content: flex-end; }
    details.more { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    details.more summary { cursor: pointer; font-size: 12.5px; font-weight: 800; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
    details.more summary::before { content: '▸'; font-size: 11px; transition: transform .15s; }
    details.more[open] summary::before { transform: rotate(90deg); }
    details.more .body { margin-top: 8px; }
    .tagbox { display: none; margin-top: 8px; }
    .tagbox.open { display: block; }
    .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .sugg button { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); font-size: 12px; cursor: pointer; }
    .sugg button.on { background: var(--accent); color: #1b1300; border-color: transparent; }

    /* 本を足す（軽く） */
    .bigq { font-size: 16px; padding: 13px 14px; }
    .who { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .who b { color: var(--ink); }
    .who button { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 11px; cursor: pointer; }

    /* 広い画面では詳細を右側のパネルにして、銀河を見せたままにする */
    @media (min-width: 900px) {
      .sheet#detail { left: auto; top: 0; bottom: 0; width: 440px; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--line);
        padding: calc(16px + env(safe-area-inset-top)) 20px 24px; transform: translateX(105%); }
      .sheet#detail.open { transform: translateX(0); }
      .sheet#detail .grab { display: none; }
      .sheet#add { left: 50%; right: auto; width: 560px; transform: translate(-50%, 105%); border-radius: 22px 22px 0 0; }
      .sheet#add.open { transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div id="grid"><div class="g" id="gridInner"></div></div>
  <div class="loading" id="loading">本を集めています…</div>

  <div class="top">
    <div class="brand">
      <h1>本の銀河</h1>
      <small id="count">QommonsAI自主研</small>
    </div>
    <button class="hearts" id="heartsBtn" type="button" title="自分の「読みたい」"><span id="heartsName">読みたい</span><span class="h" id="heartsIcons">♥♥♥</span></button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="hint" id="hint">なでて回す。気になる本をタップ。</div>
  <div class="bottom">
    <button class="btn" id="addBtn" type="button">＋ 本を足す</button>
    <button class="btn small" id="modeBtn" type="button" style="display:none">2D表示</button>
  </div>

  <section class="sheet" id="detail" aria-label="本の詳細">
    <div class="grab"></div>
    <button class="close" type="button" data-close="detail" aria-label="閉じる">×</button>
    <div id="detailBody"></div>
  </section>

  <section class="sheet" id="add" aria-label="本を足す">
    <div class="grab"></div>
    <button class="close" type="button" data-close="add" aria-label="閉じる">×</button>
    <h2 style="margin:0 0 4px;font-size:18px">この本いいよ</h2>
    <p class="note" style="margin:0 0 8px">書名か ISBN を入れて、出てきた本をタップするだけ。表紙・定価・紹介文はあとから自動で付きます。</p>
    <div class="row">
      <input type="text" id="q" class="bigq" placeholder="書名か ISBN（例：イシューからはじめよ）" autocomplete="off" enterkeyhint="search" />
      <button class="btn small" id="searchBtn" type="button">探す</button>
    </div>
    <p class="note" id="searchNote">⏳ 国会図書館と楽天ブックスに問い合わせます。数秒〜20秒ほどかかることがあります。</p>
    <div class="cands" id="cands"></div>
    <form id="addForm" style="display:none">
      <div class="picked" id="picked"></div>
      <div id="manualFields" style="display:none">
        <label for="fTitle">書名</label>
        <input type="text" id="fTitle" maxlength="120" />
        <label for="fAuthor">著者</label>
        <input type="text" id="fAuthor" maxlength="80" />
      </div>
      <label for="fObi">ひとこと（任意・推した理由を一行）</label>
      <textarea id="fObi" maxlength="120" placeholder="例：会議の空気を変える一冊。"></textarea>
      <div class="counter" id="obiCount">0 / 100</div>
      <label>タグ（任意・3つまで）</label>
      <div class="sugg" id="tagSugg"></div>
      <input type="text" id="fTags" maxlength="40" placeholder="自分で付けるなら、空白区切りで（例：仕事に効く 新人に）" />
      <div class="who" id="who"></div>
      <div class="actions"><button class="btn primary" type="submit" id="addSubmit">銀河に浮かべる</button></div>
    </form>
    <div class="actions" id="manualRow"><button class="btn small" type="button" id="manualBtn2">検索せずに手で入れる</button></div>
  </section>

  <div class="modal" id="nameModal">
    <div class="box">
      <h3>名前を教えてください</h3>
      <p id="nameNote">「読みたい」は何冊でも。名前はこの端末に覚えておきます。</p>
      <input type="text" id="nameInput" maxlength="30" placeholder="班で呼ばれている名前" />
      <div class="actions"><button class="btn primary" id="nameOk" type="button">これでいく</button><button class="btn small" id="nameCancel" type="button">やめる</button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/three.min.js"></script>
  <script>
    // ================= 設定 =================
    // 同じフォルダの api.php を使う。別の場所に置いたら API を書き換える（?api=URL でも上書き可）。
    const API = 'api.php';
    const SEED_URL = 'seed.json';
    const NAME_KEY = 'jisyuken-galaxy-name-v1';
    const DEMO_KEY = 'jisyuken-galaxy-demo-v1';
    const HINT_KEY = 'jisyuken-galaxy-hint-v1';

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const yen = (n) => (n == null || n === '' ? '定価未取得' : Math.round(Number(n)).toLocaleString('ja-JP') + ' 円');

    const apiUrl = new URLSearchParams(location.search).get('api') || API;
    let live = false;            // api.php につながっているか
    let state = { settings: { hearts: 0, maxObi: 100 }, books: [] };
    let myName = '';
    try { myName = localStorage.getItem(NAME_KEY) || ''; } catch (e) { /* 保存不可 */ }

    // ================= トースト =================
    let toastTimer;
    function toast(msg, isError) {
      const el = $('toast');
      el.textContent = msg; el.classList.toggle('error', !!isError); el.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), isError ? 3200 : 1800);
    }

    // ================= データ =================
    const DEFAULT_GENRES = { ai: 'AI・情報', books: '本・図書館', think: '考える・心', history: '歴史・地域', society: '社会・しごと', science: '科学・自然', tech: '技術・くらし', art: 'アート・あそび', words: 'ことば', story: '物語・エッセイ', other: 'その他' };
    // 分類ごとの色（星団の光と、チップの色）
    const GENRE_COLORS = { ai: '#5b8cff', books: '#ffd85a', think: '#c08cff', history: '#ffb070', society: '#ff7a9a', science: '#4fd1c5', tech: '#8fd3ff', art: '#ff9be0', words: '#a7e85a', story: '#ffc8a2', other: '#9aa6c4', '': '#7f8aa8' };
    function normalize(data) {
      return {
        settings: Object.assign({ hearts: 0, maxObi: 100, maxTags: 3, maxComment: 60, genres: DEFAULT_GENRES, tagSuggest: [] }, data.settings || {}),
        books: (data.books || []).map((b) => {
          // voters は {name, comment} の配列。古い形式（名前だけの配列）も受ける
          const voters = (b.voters || []).map((v) => (typeof v === 'string' ? { name: v, comment: '' } : v));

    function genreLabel(key) { return (state.settings.genres || DEFAULT_GENRES)[key] || '未分類'; }

    async function loadDemo() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch (e) { /* 壊れていたら作り直す */ }
      if (saved && saved.books) return normalize(saved);
      const res = await fetch(SEED_URL, { cache: 'no-store' });
      const seeds = await res.json();
      return normalize({ books: seeds.map((s) => Object.assign({}, s, { cover: s.cover || (s.isbn ? 'https://cover.openbd.jp/' + s.isbn + '.jpg' : ''), voters: [] })) });
    }
    function saveDemo() { try { localStorage.setItem(DEMO_KEY, JSON.stringify(state)); } catch (e) { /* 保存不可 */ } }

    async function fetchState() {
      try {
        const res = await fetch(apiUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error('api ' + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        live = true;
        state = normalize(data);
      } catch (err) {
        live = false;
        state = await loadDemo();
      }
    }

    function demoApply(body) {
      const hearts = state.settings.hearts; // 0 = 何冊でも
      const find = () => state.books.find((x) => x.id === body.bookId);
      if (body.action === 'vote') {
        const b = find();
        const mine = state.books.filter((x) => x.voters.some((v) => v.name === body.name)).length;
        const cur = b.voters.find((v) => v.name === body.name);
        if (cur) cur.comment = body.comment || '';
        else {
          if (hearts > 0 && mine >= hearts) throw new Error('「読みたい」は' + hearts + '冊までです。どれかを外してください');
          b.voters.push({ name: body.name, comment: body.comment || '' });
        }
      } else if (body.action === 'unvote') {
        const b = find();
        b.voters = b.voters.filter((v) => v.name !== body.name);
      } else if (body.action === 'tags') {
        find().tags = (body.tags || []).slice(0, state.settings.maxTags);
      } else if (body.action === 'genre') {
        find().genre = body.genre;
      } else if (body.action === 'addBook') {
        if (state.books.some((x) => x.title === body.title || (body.isbn && x.isbn === body.isbn))) throw new Error('その本はもう登録されています');
        state.books.push({ id: 'd' + Date.now().toString(36), title: body.title, author: body.author || '', publisher: body.publisher || '',
          price: body.price || null, isbn: body.isbn || '', cover: body.cover || (body.isbn ? 'https://cover.openbd.jp/' + body.isbn + '.jpg' : ''),
          url: body.url || '', obi: body.obi || '', proposer: body.name, voters: [], tags: body.tags || [], genre: body.genre || '', description: '', desc_src: '', created_at: new Date().toISOString() });
      }
      state.books.forEach((b) => { b.votes = b.voters.length; });
      saveDemo();
    }

    async function send(body) {
      try {
        if (!live) { demoApply(body); return true; }
        const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        state = normalize(data);
        return true;
      } catch (err) {
        toast(err.message || '送信できませんでした', true);
        return false;
      }
    }

    // ================= 表紙（プレースホルダー生成） =================
    function hue(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360; return h; }

      const w = 256, h = 366, c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d');
      const hu = hue(book.title);
      const grad = g.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, 'hsl(' + hu + ', 45%, 30%)'); grad.addColorStop(1, 'hsl(' + ((hu + 40) % 360) + ', 55%, 16%)');
      g.fillStyle = grad; g.fillRect(0, 0, w, h);

      g.fillStyle = '#fff'; g.textBaseline = 'top';
      const lines = wrap(g, book.title, w - 48, 'bold 24px "Hiragino Sans", "Yu Gothic", sans-serif', 6);
      let y = 40; lines.forEach((ln) => { g.fillText(ln, 28, y); y += 32; });
      g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '15px "Hiragino Sans", "Yu Gothic", sans-serif';

    }

    function fixBrokenCovers(root) {

    // ================= 3D =================

      const dust = points(scatter(420, sphereRadius() + 1.5, sphereRadius() + 7), 0x9fb6ff, 0.09, .55);
      sky.add(starsFar); sky.add(starsNear); scene.add(dust);

      // 星雲: 大きく淡い色の光を遠くに何枚か重ねる
      const nebulaColors = [[122, 86, 255], [54, 120, 255], [255, 92, 138], [40, 190, 200], [255, 160, 90]];
      nebulaColors.forEach((rgb, i) => {
        const [r, g, b] = rgb;
        const tex = radial(256, [[0, `rgba(${r},${g},${b},.55)`], [.35, `rgba(${r},${g},${b},.22)`], [.7, `rgba(${r},${g},${b},.06)`], [1, `rgba(${r},${g},${b},0)`]]);
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .55 + Math.random() * .2, fog: false }));
        const t = (i / nebulaColors.length) * Math.PI * 2 + Math.random(), p = Math.acos(2 * Math.random() - 1), R = 48;
        sp.position.set(R * Math.sin(p) * Math.cos(t), R * Math.sin(p) * Math.sin(t) * 0.7, R * Math.cos(p));

      const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: radial(256, [[0, 'rgba(170,190,255,.55)'], [.3, 'rgba(120,110,255,.25)'], [.65, 'rgba(255,120,160,.07)'], [1, 'rgba(0,0,0,0)']]), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .9, fog: false }));
      core.position.set(0, 0, -sphereRadius() * 1.2); const cs = sphereRadius() * 4.2; core.scale.set(cs, cs, 1); scene.add(core);

      // 光のにじみ: 人気の本には暖かい光、それ以外にも冷たいかすかな光
      const glowTex = radial(128, [[0, 'rgba(255,216,90,.9)'], [.4, 'rgba(255,160,90,.35)'], [1, 'rgba(255,120,90,0)']]);
      const glowCoolTex = radial(128, [[0, 'rgba(180,200,255,.7)'], [.4, 'rgba(120,150,255,.22)'], [1, 'rgba(90,120,255,0)']]);

      const streakC = document.createElement('canvas'); streakC.width = 256; streakC.height = 16;
      const sg = streakC.getContext('2d'); const lg = sg.createLinearGradient(0, 0, 256, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.7, 'rgba(255,255,255,.35)'); lg.addColorStop(1, 'rgba(255,255,255,1)');
      sg.fillStyle = lg; sg.fillRect(0, 0, 256, 16);
      const streak = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(streakC), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0, fog: false }));
      streak.scale.set(7, 0.12, 1); streak.visible = false; scene.add(streak);

      // 分類ごとの色の光（必要になったときに作る）
      const genreGlowCache = new Map();
      const genreGlow = (key) => {

        }

      };
      three = { renderer, scene, camera, group, sky, starsFar, starsNear, dust, glowTex, glowCoolTex, genreGlow, streak, meteor: null, nextMeteor: performance.now() + 5000,
        camZ: 10, sprites: new Map(), glows: new Map(), selected: null, targetQ: null,
        vel: { x: 0, y: 0 }, lastInteract: 0, dragging: false, loader: new THREE.TextureLoader() };

    function resize() {
      if (!three) return;
      const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
      three.renderer.setSize(w, h);
      three.camera.aspect = aspect; three.camera.updateProjectionMatrix();
      const radius = sphereRadius() + 1.6;
      const vfov = THREE.MathUtils.degToRad(three.camera.fov);
      const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
      // 球が画面からすこしはみ出すくらいに寄る（スマホで迫力が出る）
      three.camZ = radius / Math.tan(Math.min(vfov, hfov) / 2) * (aspect < 1 ? 0.72 : 0.8);
      three.camera.position.set(0, 0, three.camZ);
      three.camera.lookAt(0, 0, 0);
    }

    function sphereRadius() { return 4.6 + Math.sqrt(Math.max(1, state.books.length)) * 0.5; }

    // フィボナッチ球に並べる。「読みたい」が多い本ほど中心寄りで大きい
    // 分類ごとに星団を作る。各星団の中心を球面上に散らし、その周りに本を並べる。
    // 「読みたい」が多い本ほど中心寄りで大きい
    let genreFilter = '';
    function layout(animate) {
      if (!three) return;
      const books = state.books.slice().sort((a, b) => b.votes - a.votes || (a.created_at || '').localeCompare(b.created_at || ''));
      const R = sphereRadius();
      const maxV = Math.max(1, ...books.map((b) => b.votes));
      const golden = Math.PI * (3 - Math.sqrt(5));
      // 星団の中心（分類の数だけ、球面に均等に）
      const order = Object.keys(state.settings.genres || DEFAULT_GENRES).concat(['']);
      const groups = new Map();
      books.forEach((b) => { const k = b.genre || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); });
      const keys = [...groups.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b));
      const G = keys.length;
      const centers = new Map();
      keys.forEach((k, gi) => {
        const y = G === 1 ? 0.15 : 0.8 - (gi / (G - 1)) * 1.6, rr = Math.sqrt(1 - y * y), th = golden * gi + 0.7;
        centers.set(k, new THREE.Vector3(Math.cos(th) * rr, y, Math.sin(th) * rr).normalize());
      });
      keys.forEach((k) => {
        const list = groups.get(k), c = centers.get(k);
        // 中心方向に直交する2軸（星団内の広がりに使う）
        const up = Math.abs(c.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
        const u = new THREE.Vector3().crossVectors(c, up).normalize(), v = new THREE.Vector3().crossVectors(c, u).normalize();
        const spread = Math.min(0.95, 0.28 + 0.12 * Math.sqrt(list.length)); // 冊数が多い星団ほど広い
        list.forEach((b, j) => {
          const rad = spread * Math.sqrt((j + 0.5) / list.length), ang = golden * j + hue(b.id) / 57;
          const dir = c.clone().addScaledVector(u, Math.cos(ang) * rad).addScaledVector(v, Math.sin(ang) * rad).normalize();
          const pull = 0.45 * (b.votes / maxV);
          const target = dir.multiplyScalar(R * (1 - pull));
          const sprite = ensureSprite(b);
          sprite.userData.target = target;
          sprite.userData.scale = 1 + 0.35 * (b.votes / maxV) * (b.votes > 0 ? 1 : 0);
          if (!sprite.userData.placed) {
            // 初めて現れる本は中心から広がって自分の場所へ（最初の読み込みでは銀河が生まれるように見える）
            sprite.position.copy(target).multiplyScalar(animate ? 0.3 : 0.04);
            sprite.userData.placed = true;
          } else if (!animate) sprite.position.copy(target);
          let glow = three.glows.get(b.id);
          if (!glow) {
            glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: three.glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .3 }));
            three.group.add(glow); three.glows.set(b.id, glow);
          }

          glow.material.map = b.votes > 0 ? three.glowTex : three.genreGlow(b.genre || '');
          glow.material.opacity = b.votes > 0 ? .6 : .32;
          glow.material.needsUpdate = true;
          glow.userData.size = COVER_H * (b.votes > 0 ? 1.15 + 0.7 * b.votes / maxV : 1.3);
          glow.visible = true;
        });
      });
      // 消えた本
      for (const [id, sp] of three.sprites) if (!books.some((b) => b.id === id)) {
        three.group.remove(sp); three.sprites.delete(id);
        const g = three.glows.get(id); if (g) { three.group.remove(g); three.glows.delete(id); }
      }
    }

    function ensureSprite(book) {

      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      sp = new THREE.Sprite(mat);
      sp.scale.set(COVER_H * 0.7, COVER_H, 1);
      sp.userData = { book, scale: 1, cur: 0.001, placed: false, aspect: 0.7 };

    function tick(now) {

      } else if (!three.dragging) {

        const vx = three.vel.x, vy = three.vel.y;

        three.vel.x *= 0.94; three.vel.y *= 0.94;

      three.sky.rotation.y += 0.00012; three.sky.rotation.x = Math.sin(now * 0.00002) * 0.05;
      three.starsNear.material.opacity = 0.75 + 0.25 * Math.sin(now * 0.0011);

      three.dust.rotation.y -= 0.00035; three.dust.rotation.z = Math.sin(now * 0.00005) * 0.1;

        else { three.streak.position.copy(m.from).lerp(m.to, k); three.streak.material.opacity = Math.sin(k * Math.PI) * 0.9; }
      } else if (now > three.nextMeteor && !three.dragging) {
        const a = Math.random() * Math.PI * 2, y = (Math.random() - 0.3) * 18, R = 30;
        const from = new THREE.Vector3(Math.cos(a) * R, y + 6, Math.sin(a) * R), to = new THREE.Vector3(Math.cos(a + 0.5) * R, y - 4, Math.sin(a + 0.5) * R);
        three.meteor = { from, to, t0: now, dur: 900 + Math.random() * 500 };
        three.streak.visible = true; three.streak.material.rotation = Math.atan2(to.y - from.y, to.x - from.x);
      }

        const dim = genreFilter && (u.book.genre || '') !== genreFilter;

        }

    }

    const _qx = new THREE.Quaternion(), _qy = new THREE.Quaternion();
    function rotateBy(dy, dx) {
      // dy: 横ドラッグ → 世界Y軸回り、dx: 縦ドラッグ → 世界X軸回り
      _qy.setFromAxisAngle(new THREE.Vector3(0, 1, 0), dy);
      _qx.setFromAxisAngle(new THREE.Vector3(1, 0, 0), dx);
      three.group.quaternion.premultiply(_qy).premultiply(_qx);
    }

    function bindPointer(el) {
      let down = null, moved = 0, lastX = 0, lastY = 0, lastT = 0, pinch = null;
      const pts = new Map();
      el.addEventListener('pointerdown', (e) => {
        pts.set(e.pointerId, e);
        el.setPointerCapture(e.pointerId);
        if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); down = null; return; }
        down = { x: e.clientX, y: e.clientY, t: performance.now() }; moved = 0; lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
        three.dragging = true; three.targetQ = null; three.vel.x = three.vel.y = 0; three.lastInteract = performance.now();
      });
      el.addEventListener('pointermove', (e) => {
        if (!pts.has(e.pointerId)) return;
        pts.set(e.pointerId, e);
        if (pts.size === 2 && pinch) {
          const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
          zoom((pinch - d) * 0.01); pinch = d; return;
        }
        if (!down) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY, t = performance.now();
        moved += Math.abs(dx) + Math.abs(dy);
        const k = 0.0055;
        rotateBy(dx * k, dy * k);
        const dt = Math.max(8, t - lastT);
        three.vel.x = dx * k * (16 / dt) * 0.9; three.vel.y = dy * k * (16 / dt) * 0.9;
        lastX = e.clientX; lastY = e.clientY; lastT = t; three.lastInteract = t;
      });
      const up = (e) => {
        pts.delete(e.pointerId);
        if (pts.size < 2) pinch = null;
        if (pts.size === 0) three.dragging = false;
        if (down && moved < 8 && performance.now() - down.t < 500) pick(e.clientX, e.clientY);
        down = null; three.lastInteract = performance.now();
      };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      el.addEventListener('wheel', (e) => { e.preventDefault(); zoom(e.deltaY * 0.004); }, { passive: false });
    }

    function zoom(d) {
      three.camZ = THREE.MathUtils.clamp(three.camZ + d, sphereRadius() * 0.6, sphereRadius() * 4);
      three.camera.position.z = three.camZ; three.lastInteract = performance.now();
    }

    const raycaster = new THREE.Raycaster();
    function pick(x, y) {
      const v = new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(v, three.camera);
      const hits = raycaster.intersectObjects([...three.sprites.values()], false);
      if (hits.length) select(hits[0].object.userData.book.id);
      else closeSheet('detail');
    }

    function select(id) {
      const sp = three && three.sprites.get(id);

          const dir = sp.position.clone().normalize();
          // 詳細に隠れないよう、スマホでは画面の上寄り、PC（右パネル）では左寄りに来る向きへ
          const wide = window.innerWidth >= 900;
          const q = new THREE.Quaternion().setFromUnitVectors(dir, new THREE.Vector3(wide ? -0.45 : 0, wide ? 0.1 : 0.55, 1).normalize());
          three.targetQ = q;
          three.vel.x = three.vel.y = 0; three.lastInteract = performance.now() + 4000;
        }

      openSheet('detail');
      hideHint();

      fixBrokenCovers($('detailBody'));

    async function voteWith(id, comment) {

    // タグ入力の補助: よく使われているタグをチップで出し、押すと入力欄に足し引き
    function splitTags(v) { return [...new Set(String(v).split(/[\s,、#＃]+/).map((t) => t.trim()).filter(Boolean))].slice(0, state.settings.maxTags); }
    function renderTagSugg(box, input, current) {
      const sug = [...new Set((state.settings.tagSuggest || []).concat(current || []))].slice(0, 12);
      box.innerHTML = sug.map((t) => `<button type="button" data-t="${esc(t)}" class="${(current || []).includes(t) ? 'on' : ''}">#${esc(t)}</button>`).join('');
      box.querySelectorAll('[data-t]').forEach((el) => el.addEventListener('click', () => {
        let cur = splitTags(input.value); const t = el.dataset.t;
        cur = cur.includes(t) ? cur.filter((x) => x !== t) : cur.concat([t]).slice(0, state.settings.maxTags);
        input.value = cur.join(' '); renderTagSugg(box, input, cur);

    async function search() {
      const q = $('q').value.trim(); if (!q) return;
      // 外部 API（国会図書館・楽天）に問い合わせるので待たせる。経過秒数を見せて不安を減らす
      const started = Date.now();
      const showWait = () => { const s = Math.round((Date.now() - started) / 1000); $('cands').innerHTML = `<p class="note">⏳ 探しています… ${s} 秒${s >= 15 ? '（もう少しお待ちください）' : ''}</p>`; };
      showWait(); const waitTimer = setInterval(showWait, 1000);
      $('searchBtn').disabled = true;
      let cands = [];
      try {
        if (live) {
          const res = await fetch(apiUrl + (apiUrl.includes('?') ? '&' : '?') + 'lookup=' + encodeURIComponent(q));
          cands = (await res.json()).candidates || [];
        } else {
          cands = await lookupDirect(q);
        }
      } catch (e) { cands = []; }
      clearInterval(waitTimer); $('searchBtn').disabled = false;
      if (!cands.length) { $('cands').innerHTML = '<p class="note">見つかりませんでした。下の「手で入れる」からどうぞ。</p>'; return; }
      $('cands').innerHTML = cands.map((c, i) => `

          <span><b>${esc(c.title)}</b><small>${esc(c.author || '')}${c.publisher ? '｜' + esc(c.publisher) : ''}${c.price ? '｜' + yen(c.price) : ''}</small></span>

    }

    // お試しモード用：ブラウザから直接 Google Books / openBD を引く
    async function lookupDirect(q) {
      const digits = q.replace(/[^0-9X]/g, '');
      const out = [];
      if (digits.length === 13 || digits.length === 10) {
        try {
          const r = await fetch('https://api.openbd.jp/v1/get?isbn=' + digits); const d = await r.json();
          if (d && d[0] && d[0].summary) { const s = d[0].summary; out.push({ title: s.title, author: s.author, publisher: s.publisher, isbn: s.isbn, cover: s.cover || '', price: null }); }
        } catch (e) { /* 取れなければ次へ */ }
      }
      try {
        const r = await fetch('https://www.googleapis.com/books/v1/volumes?' + new URLSearchParams({ q, langRestrict: 'ja', maxResults: 6, printType: 'books' }));
        const d = await r.json();
        (d.items || []).forEach((it) => {
          const v = it.volumeInfo || {}; const ids = v.industryIdentifiers || [];
          const isbn = (ids.find((x) => x.type === 'ISBN_13') || {}).identifier || '';
          const thumb = ((v.imageLinks || {}).thumbnail || '').replace(/^http:/, 'https:');
          out.push({ title: [v.title, v.subtitle].filter(Boolean).join(' '), author: (v.authors || []).join('・'), publisher: v.publisher || '',
            isbn, cover: thumb, price: ((it.saleInfo || {}).listPrice || {}).amount || null });
        });
      } catch (e) { /* 取れなければそのまま */ }
      return out;
    }

      const books = state.books.filter((b) => !genreFilter || (b.genre || '') === genreFilter).sort((a, b) => b.votes - a.votes);
      $('gridInner').innerHTML = books.map((b) => `
        <button type="button" data-id="${esc(b.id)}">
          ${coverImg(b)}
          <b>${esc(b.title)}</b>${b.votes ? `<small style="color:var(--heart)">♥${b.votes}</small>` : ''}
        </button>`).join('');
      fixBrokenCovers($('gridInner'));
      $('gridInner').querySelectorAll('[data-id]').forEach((el) => el.addEventListener('click', () => { renderDetail(el.dataset.id); openSheet('detail'); }));
    }
    function setMode(is2d) {
      mode2d = is2d;
      $('grid').style.display = is2d ? 'block' : 'none';
      $('stage').style.display = is2d ? 'none' : 'block';
      $('modeBtn').textContent = is2d ? '3D表示' : '2D表示';
      renderGrid();
    }
    $('modeBtn').addEventListener('click', () => setMode(!mode2d));

    // ================= 起動 =================
    (async function main() {
      await fetchState();
      $('loading').style.display = 'none';
      renderTop();
      const ok = initThree();
      if (ok) { layout(false); $('modeBtn').style.display = ''; }
      else { $('modeBtn').style.display = 'none'; setMode(true); }
      if (live) setInterval(async () => {
        if (document.hidden || $('add').classList.contains('open')) return;
        const before = JSON.stringify(state.books.map((b) => [b.id, b.votes, b.cover, b.genre, (b.tags || []).join(','), b.voters.map((v) => v.comment).join('|')]));
        await fetchState();
        if (JSON.stringify(state.books.map((b) => [b.id, b.votes, b.cover, b.genre, (b.tags || []).join(','), b.voters.map((v) => v.comment).join('|')])) !== before) afterChange();
      }, 45000);
    })();
  </script>
</body>
</html>
